name: Agente Tech

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas (cheio; o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Enviar mensagem de teste"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agente-tech
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SCORE_MIN: ${{ vars.SCORE_MIN }}
        run: |
          # variáveis vazias -> usa os padrões do config.py
          for v in CLAUDE_MODEL SCORE_MIN WHATSAPP_TEMPLATE; do [ -z "${!v}" ] && unset $v; done
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python -m agente.main --test-notify
          else
            python -m agente.main
          fi

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "agente-tech[bot]"
          git config user.email "agente-tech@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "estado: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase -X theirs -q && git push -q
